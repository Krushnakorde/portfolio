<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="#0b1329" rx="12"/>

  <!-- Top bar -->
  <rect width="600" height="40" fill="#0f172a" rx="12 12 0 0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="160" y="10" width="280" height="20" rx="6" fill="#1e293b"/>
  <text x="300" y="24" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">medicare-frontend-six-sigma.vercel.app</text>

  <!-- Hero Header / Banner inside app -->
  <g transform="translate(20, 50)">
    <rect width="560" height="85" rx="10" fill="url(#medBg)"/>
    <text x="25" y="32" fill="#bae6fd" font-size="11" font-family="system-ui" font-weight="bold">HEALTHCARE & DOCTOR BOOKING PORTAL</text>
    <text x="25" y="58" fill="#ffffff" font-size="20" font-family="system-ui" font-weight="extrabold">Find & Book Specialist Doctors Online</text>
    <text x="25" y="75" fill="#e0f2fe" font-size="10" font-family="system-ui">Verified Physicians • Video Consultations • Prescription History</text>
    <rect x="425" y="25" width="115" height="35" rx="8" fill="#ffffff"/>
    <text x="482" y="47" fill="#0284c7" font-size="11" font-family="system-ui" font-weight="bold" text-anchor="middle">Book Visit 🩺</text>
  </g>

  <!-- Specialist Doctor Card 1 -->
  <g transform="translate(20, 145)">
    <rect width="175" height="210" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="145" height="85" rx="8" fill="#0f172a"/>
    <circle cx="87" cy="55" r="26" fill="#0284c7"/>
    <text x="87" y="62" fill="#ffffff" font-size="22" text-anchor="middle">👨‍⚕️</text>
    <text x="15" y="122" fill="#ffffff" font-size="12" font-family="system-ui" font-weight="bold">Dr. Rajesh Patel</text>
    <text x="15" y="138" fill="#38bdf8" font-size="10" font-family="system-ui">Cardiologist • 12 Yrs Exp</text>
    <text x="15" y="158" fill="#34d399" font-size="10" font-family="system-ui">★ 4.9 (180+ Reviews)</text>
    <rect x="15" y="172" width="145" height="28" rx="6" fill="url(#btnGrad)"/>
    <text x="87" y="190" fill="#ffffff" font-size="10" font-family="system-ui" font-weight="bold" text-anchor="middle">Appointment</text>
  </g>

  <!-- Specialist Doctor Card 2 -->
  <g transform="translate(212, 145)">
    <rect width="175" height="210" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="145" height="85" rx="8" fill="#0f172a"/>
    <circle cx="87" cy="55" r="26" fill="#059669"/>
    <text x="87" y="62" fill="#ffffff" font-size="22" text-anchor="middle">👩‍⚕️</text>
    <text x="15" y="122" fill="#ffffff" font-size="12" font-family="system-ui" font-weight="bold">Dr. Neha Kulkarni</text>
    <text x="15" y="138" fill="#38bdf8" font-size="10" font-family="system-ui">Neurologist • 9 Yrs Exp</text>
    <text x="15" y="158" fill="#34d399" font-size="10" font-family="system-ui">★ 4.8 (145+ Reviews)</text>
    <rect x="15" y="172" width="145" height="28" rx="6" fill="url(#btnGrad)"/>
    <text x="87" y="190" fill="#ffffff" font-size="10" font-family="system-ui" font-weight="bold" text-anchor="middle">Appointment</text>
  </g>

  <!-- Appointment & Calendar Summary Card -->
  <g transform="translate(404, 145)">
    <rect width="175" height="210" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="15" y="28" fill="#f8fafc" font-size="11" font-family="system-ui" font-weight="bold">Upcoming Schedule</text>
    
    <!-- Mini Calendar Pill -->
    <rect x="15" y="42" width="145" height="42" rx="6" fill="#1e293b"/>
    <text x="25" y="60" fill="#38bdf8" font-size="9" font-family="system-ui" font-weight="bold">Tomorrow, 10:30 AM</text>
    <text x="25" y="74" fill="#cbd5e1" font-size="9" font-family="system-ui">General Checkup • Room 3</text>

    <!-- Metrics -->
    <text x="15" y="112" fill="#94a3b8" font-size="9" font-family="system-ui">Available Doctors:</text>
    <text x="160" y="112" fill="#34d399" font-size="11" font-family="system-ui" font-weight="bold" text-anchor="end">42 Online</text>

    <text x="15" y="134" fill="#94a3b8" font-size="9" font-family="system-ui">Departments:</text>
    <text x="160" y="134" fill="#ffffff" font-size="11" font-family="system-ui" font-weight="bold" text-anchor="end">12 Specialties</text>

    <!-- Vercel Deployment badge -->
    <rect x="15" y="160" width="145" height="36" rx="6" fill="#000000" stroke="#334155" stroke-width="1"/>
    <polygon points="30,183 36,172 42,183" fill="#ffffff"/>
    <text x="50" y="182" fill="#ffffff" font-size="9.5" font-family="system-ui" font-weight="bold">Deployed on Vercel</text>
  </g>
</svg>
