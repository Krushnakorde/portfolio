<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="p1accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p1bg)" rx="12"/>
  <!-- Window top bar -->
  <rect width="600" height="40" fill="#1e293b" rx="12 12 0 0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="200" y="10" width="200" height="20" rx="6" fill="#0f172a"/>
  <text x="300" y="24" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">devsync.workspace.io</text>

  <!-- Left Sidebar -->
  <rect x="15" y="55" width="120" height="305" rx="8" fill="#1e293b" opacity="0.6"/>
  <rect x="25" y="70" width="80" height="10" rx="5" fill="#38bdf8"/>
  <rect x="25" y="95" width="90" height="8" rx="4" fill="#475569"/>
  <rect x="25" y="115" width="70" height="8" rx="4" fill="#475569"/>
  <rect x="25" y="135" width="85" height="8" rx="4" fill="#475569"/>
  <rect x="25" y="165" width="60" height="8" rx="4" fill="#64748b"/>
  <rect x="25" y="185" width="75" height="8" rx="4" fill="#475569"/>

  <!-- Code Editor Main Area -->
  <rect x="145" y="55" width="440" height="305" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
  <!-- Tab bar -->
  <rect x="145" y="55" width="440" height="30" fill="#1e293b"/>
  <rect x="155" y="60" width="90" height="25" rx="4" fill="#0b0f19"/>
  <text x="180" y="76" fill="#38bdf8" font-size="11" font-family="monospace">App.tsx</text>
  <rect x="250" y="60" width="90" height="25" rx="4" fill="#1e293b"/>
  <text x="270" y="76" fill="#64748b" font-size="11" font-family="monospace">server.js</text>

  <!-- Code Syntax Mock -->
  <text x="165" y="115" fill="#c084fc" font-size="12" font-family="monospace">import</text>
  <text x="215" y="115" fill="#f8fafc" font-size="12" font-family="monospace">{ io } from 'socket.io-client';</text>
  <text x="165" y="140" fill="#60a5fa" font-size="12" font-family="monospace">const</text>
  <text x="205" y="140" fill="#fcd34d" font-size="12" font-family="monospace">socket</text>
  <text x="255" y="140" fill="#f8fafc" font-size="12" font-family="monospace">= io('https://api.devsync.app');</text>
  
  <text x="165" y="175" fill="#4ade80" font-size="12" font-family="monospace">// Live Collaborative Session Active</text>
  <text x="165" y="200" fill="#60a5fa" font-size="12" font-family="monospace">function</text>
  <text x="225" y="200" fill="#38bdf8" font-size="12" font-family="monospace">handleSync</text>
  <text x="295" y="200" fill="#f8fafc" font-size="12" font-family="monospace">(patch) {</text>
  <text x="185" y="225" fill="#f8fafc" font-size="12" font-family="monospace">  broadcastUpdate(patch);</text>
  <text x="165" y="250" fill="#f8fafc" font-size="12" font-family="monospace">}</text>

  <!-- Floating Active Avatars / Realtime Pill -->
  <g transform="translate(420, 275)">
    <rect width="150" height="40" rx="20" fill="#1e293b" stroke="url(#p1accent)" stroke-width="2"/>
    <circle cx="20" cy="20" r="12" fill="#10b981"/>
    <text x="20" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">4</text>
    <text x="40" y="25" fill="#38bdf8" font-size="11" font-family="system-ui" font-weight="bold">Devs Online</text>
  </g>
</svg>
