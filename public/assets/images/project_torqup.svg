<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="torqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="torqAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#torqBg)" rx="12"/>

  <!-- Top Window Header -->
  <rect width="600" height="40" fill="#1e293b" rx="12 12 0 0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="180" y="10" width="240" height="20" rx="6" fill="#0f172a"/>
  <text x="300" y="24" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">torqup.utility.app/dashboard</text>

  <!-- Left Sidebar (Mobile + Web Architecture) -->
  <rect x="15" y="55" width="115" height="305" rx="8" fill="#1e293b" opacity="0.7"/>
  <text x="25" y="80" fill="#38bdf8" font-size="12" font-family="system-ui" font-weight="bold">⚡ TorqUp</text>
  <rect x="25" y="98" width="90" height="6" rx="3" fill="#64748b"/>
  <rect x="25" y="118" width="75" height="6" rx="3" fill="#475569"/>
  <rect x="25" y="138" width="85" height="6" rx="3" fill="#475569"/>
  <rect x="25" y="158" width="60" height="6" rx="3" fill="#475569"/>
  
  <rect x="25" y="295" width="90" height="24" rx="12" fill="#0369a1"/>
  <text x="70" y="311" fill="#ffffff" font-size="9" font-family="system-ui" font-weight="bold" text-anchor="middle">OFFLINE READY</text>

  <!-- Center Mobile Frame Mockup (React Native) -->
  <g transform="translate(145, 55)">
    <rect width="180" height="305" rx="16" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <!-- Notch -->
    <rect x="60" y="6" width="60" height="10" rx="5" fill="#1e293b"/>
    
    <!-- App Header -->
    <text x="15" y="36" fill="#f8fafc" font-size="11" font-family="system-ui" font-weight="bold">TorqUp Mobile</text>
    <circle cx="160" cy="32" r="5" fill="#10b981"/>

    <!-- Offline sync indicator card -->
    <rect x="12" y="48" width="156" height="50" rx="8" fill="url(#torqAccent)"/>
    <text x="20" y="66" fill="#ffffff" font-size="9" font-family="system-ui" font-weight="bold">Local Sync Engine</text>
    <text x="20" y="80" fill="#e0f2fe" font-size="8" font-family="system-ui">WatermelonDB • Async Queue</text>
    <text x="20" y="91" fill="#ffffff" font-size="8" font-family="system-ui" font-weight="bold">Status: Synced ✓</text>

    <!-- Utility Modules Grid -->
    <g transform="translate(12, 110)">
      <rect width="72" height="55" rx="6" fill="#1e293b"/>
      <text x="36" y="28" fill="#38bdf8" font-size="14" text-anchor="middle">📊</text>
      <text x="36" y="44" fill="#cbd5e1" font-size="8" font-family="system-ui" text-anchor="middle">Analytics</text>
    </g>
    <g transform="translate(94, 110)">
      <rect width="74" height="55" rx="6" fill="#1e293b"/>
      <text x="37" y="28" fill="#818cf8" font-size="14" text-anchor="middle">⚡</text>
      <text x="37" y="44" fill="#cbd5e1" font-size="8" font-family="system-ui" text-anchor="middle">Telemetry</text>
    </g>
    <g transform="translate(12, 175)">
      <rect width="72" height="55" rx="6" fill="#1e293b"/>
      <text x="36" y="28" fill="#34d399" font-size="14" text-anchor="middle">📁</text>
      <text x="36" y="44" fill="#cbd5e1" font-size="8" font-family="system-ui" text-anchor="middle">Cache DB</text>
    </g>
    <g transform="translate(94, 175)">
      <rect width="74" height="55" rx="6" fill="#1e293b"/>
      <text x="37" y="28" fill="#f43f5e" font-size="14" text-anchor="middle">⚙️</text>
      <text x="37" y="44" fill="#cbd5e1" font-size="8" font-family="system-ui" text-anchor="middle">Settings</text>
    </g>

    <!-- Mobile Bottom Navigation -->
    <rect x="0" y="270" width="180" height="35" rx="0 0 16 16" fill="#0f172a"/>
    <circle cx="45" cy="287" r="4" fill="#38bdf8"/>
    <circle cx="90" cy="287" r="4" fill="#64748b"/>
    <circle cx="135" cy="287" r="4" fill="#64748b"/>
  </g>

  <!-- Right Web Analytics Dashboard -->
  <g transform="translate(340, 55)">
    <rect width="245" height="305" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="18" y="28" fill="#f8fafc" font-size="12" font-family="system-ui" font-weight="bold">Web Admin Dashboard</text>
    
    <!-- Real-time metrics -->
    <rect x="18" y="45" width="100" height="55" rx="6" fill="#1e293b"/>
    <text x="26" y="62" fill="#94a3b8" font-size="9" font-family="system-ui">Queue Size</text>
    <text x="26" y="85" fill="#38bdf8" font-size="16" font-family="system-ui" font-weight="bold">0 msgs</text>

    <rect x="126" y="45" width="100" height="55" rx="6" fill="#1e293b"/>
    <text x="134" y="62" fill="#94a3b8" font-size="9" font-family="system-ui">Uptime</text>
    <text x="134" y="85" fill="#34d399" font-size="16" font-family="system-ui" font-weight="bold">99.98%</text>

    <!-- Code Block / Architecture -->
    <rect x="18" y="115" width="208" height="170" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
    <text x="28" y="135" fill="#c084fc" font-size="10" font-family="monospace">const</text>
    <text x="65" y="135" fill="#f8fafc" font-size="10" font-family="monospace">syncManager =</text>
    <text x="28" y="152" fill="#38bdf8" font-size="10" font-family="monospace">  new OfflineSync({</text>
    <text x="38" y="170" fill="#fcd34d" font-size="10" font-family="monospace">    storage: 'MongoDB',</text>
    <text x="38" y="188" fill="#4ade80" font-size="10" font-family="monospace">    strategy: 'cache-first',</text>
    <text x="38" y="206" fill="#f43f5e" font-size="10" font-family="monospace">    retryLimit: 5</text>
    <text x="28" y="224" fill="#38bdf8" font-size="10" font-family="monospace">  });</text>
    <text x="28" y="250" fill="#94a3b8" font-size="9" font-family="monospace">// State synced smoothly</text>
    <circle cx="195" cy="250" r="5" fill="#10b981"/>
  </g>
</svg>
