<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with glowing ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#bgGrad)" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
  <circle cx="200" cy="200" r="185" fill="#0f172a" />
  
  <!-- Subtle tech pattern in background -->
  <g opacity="0.15" stroke="#6366f1" stroke-width="1.5">
    <circle cx="200" cy="200" r="140" fill="none" stroke-dasharray="8 6"/>
    <circle cx="200" cy="200" r="100" fill="none" stroke-dasharray="4 4"/>
    <line x1="60" y1="200" x2="340" y2="200" stroke-dasharray="6 6"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke-dasharray="6 6"/>
  </g>

  <!-- Torso & Hoodie -->
  <path d="M 100 370 C 100 290, 140 260, 200 260 C 260 260, 300 290, 300 370 Z" fill="url(#hoodieGrad)"/>
  <!-- Hoodie collar detail -->
  <path d="M 160 265 Q 200 305 240 265 L 225 330 Q 200 340 175 330 Z" fill="#334155" />
  <circle cx="200" cy="325" r="4" fill="#38bdf8" />
  <line x1="185" y1="290" x2="180" y2="330" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="215" y1="290" x2="220" y2="330" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="40" rx="6" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="145" cy="180" rx="10" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="255" cy="180" rx="10" ry="16" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <path d="M 142 165 C 140 120, 160 100, 200 100 C 240 100, 260 120, 258 165 C 250 150, 235 145, 210 148 C 180 152, 165 145, 142 165 Z" fill="url(#hairGrad)"/>
  <!-- Hair strands / modern quiff -->
  <path d="M 170 105 C 190 85, 230 90, 245 108 C 230 102, 210 103, 195 110 Z" fill="#4338ca"/>

  <!-- Glasses / Developer look -->
  <rect x="156" y="165" width="34" height="24" rx="8" fill="none" stroke="#0ea5e9" stroke-width="3.5"/>
  <rect x="210" y="165" width="34" height="24" rx="8" fill="none" stroke="#0ea5e9" stroke-width="3.5"/>
  <line x1="190" y1="175" x2="210" y2="175" stroke="#0ea5e9" stroke-width="3.5"/>
  <path d="M 145 174 L 156 174" stroke="#0ea5e9" stroke-width="3"/>
  <path d="M 244 174 L 255 174" stroke="#0ea5e9" stroke-width="3"/>

  <!-- Eyes behind glasses -->
  <circle cx="173" cy="177" r="4.5" fill="#1e293b"/>
  <circle cx="175" cy="175" r="1.5" fill="#ffffff"/>
  <circle cx="227" cy="177" r="4.5" fill="#1e293b"/>
  <circle cx="229" cy="175" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 160 158 Q 173 154 186 160" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 214 160 Q 227 154 240 158" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 198 185 Q 200 196 205 198" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Smile -->
  <path d="M 185 212 Q 200 224 215 212" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Tech Badges / Floating Elements -->
  <!-- Left Code badge -->
  <g transform="translate(45, 120)">
    <rect width="60" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="30" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">&lt;/&gt;</text>
  </g>
  
  <!-- Right React/Atom badge -->
  <g transform="translate(295, 120)">
    <rect width="60" height="32" rx="16" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">JS/TS</text>
  </g>

  <!-- Bottom verified badge -->
  <g transform="translate(160, 325)">
    <rect width="80" height="26" rx="13" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
    <text x="40" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ecfdf5" text-anchor="middle">ONLINE</text>
  </g>
</svg>
