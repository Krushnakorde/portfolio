<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p2bg)" rx="12"/>
  
  <!-- Browser top -->
  <rect width="600" height="40" fill="#065f46" rx="12 12 0 0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="300" y="25" fill="#a7f3d0" font-size="12" font-family="system-ui" text-anchor="middle" font-weight="bold">🌱 EcoTrack Carbon Intelligence</text>

  <!-- Metric Card 1 -->
  <g transform="translate(25, 60)">
    <rect width="165" height="85" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
    <text x="15" y="28" fill="#a7f3d0" font-size="11" font-family="system-ui">Total Offset</text>
    <text x="15" y="58" fill="#ffffff" font-size="22" font-weight="bold" font-family="system-ui">142.8 kg</text>
    <text x="15" y="75" fill="#34d399" font-size="10" font-family="system-ui">▲ +18.4% vs last week</text>
  </g>

  <!-- Metric Card 2 -->
  <g transform="translate(215, 60)">
    <rect width="165" height="85" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
    <text x="15" y="28" fill="#a7f3d0" font-size="11" font-family="system-ui">Energy Efficiency</text>
    <text x="15" y="58" fill="#ffffff" font-size="22" font-weight="bold" font-family="system-ui">94.2%</text>
    <text x="15" y="75" fill="#34d399" font-size="10" font-family="system-ui">Grade A+ Certified</text>
  </g>

  <!-- Metric Card 3 -->
  <g transform="translate(405, 60)">
    <rect width="165" height="85" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
    <text x="15" y="28" fill="#a7f3d0" font-size="11" font-family="system-ui">Trees Planted</text>
    <text x="15" y="58" fill="#ffffff" font-size="22" font-weight="bold" font-family="system-ui">680</text>
    <text x="15" y="75" fill="#34d399" font-size="10" font-family="system-ui">Community Goal</text>
  </g>

  <!-- Big Chart -->
  <g transform="translate(25, 165)">
    <rect width="545" height="190" rx="10" fill="#022c22" stroke="#065f46" stroke-width="1.5"/>
    <text x="20" y="30" fill="#ecfdf5" font-size="13" font-weight="bold" font-family="system-ui">Carbon Reduction Analytics (Monthly)</text>

    <!-- Chart grid lines -->
    <line x1="20" y1="60" x2="525" y2="60" stroke="#064e3b" stroke-dasharray="3 3"/>
    <line x1="20" y1="100" x2="525" y2="100" stroke="#064e3b" stroke-dasharray="3 3"/>
    <line x1="20" y1="140" x2="525" y2="140" stroke="#064e3b" stroke-dasharray="3 3"/>

    <!-- Area polygon under line -->
    <polygon points="40,150 100,125 170,135 240,95 310,110 380,70 450,85 510,45 510,165 40,165" fill="url(#chartGrad)"/>
    <!-- Line curve -->
    <polyline points="40,150 100,125 170,135 240,95 310,110 380,70 450,85 510,45" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Data points -->
    <circle cx="100" cy="125" r="4.5" fill="#34d399"/>
    <circle cx="240" cy="95" r="4.5" fill="#34d399"/>
    <circle cx="380" cy="70" r="4.5" fill="#34d399"/>
    <circle cx="510" cy="45" r="5.5" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  </g>
</svg>
