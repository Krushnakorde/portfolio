<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="visBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="visAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#visBg)" rx="12"/>

  <!-- Top Window Header -->
  <rect width="600" height="40" fill="#065f46" rx="12 12 0 0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="300" y="25" fill="#a7f3d0" font-size="12" font-family="system-ui" text-anchor="middle" font-weight="bold">💼 Vistabills - Brokerage Invoicing & Commission Engine</text>

  <!-- Left Side: Invoicing & Commission Stats -->
  <g transform="translate(25, 55)">
    <!-- KPI 1 -->
    <rect width="170" height="75" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
    <text x="15" y="24" fill="#a7f3d0" font-size="10" font-family="system-ui">Total Billed Volume</text>
    <text x="15" y="52" fill="#ffffff" font-size="20" font-weight="bold" font-family="system-ui">₹ 14.8 Lakh</text>
    <text x="15" y="68" fill="#34d399" font-size="9" font-family="system-ui">▲ +24.5% this quarter</text>

    <!-- KPI 2 -->
    <g transform="translate(0, 85)">
      <rect width="170" height="75" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
      <text x="15" y="24" fill="#a7f3d0" font-size="10" font-family="system-ui">Broker Commission</text>
      <text x="15" y="52" fill="#ffffff" font-size="20" font-weight="bold" font-family="system-ui">₹ 2.15 Lakh</text>
      <text x="15" y="68" fill="#38bdf8" font-size="9" font-family="system-ui">Auto Split Calculated</text>
    </g>

    <!-- Play Store Release Card -->
    <g transform="translate(0, 170)">
      <rect width="170" height="135" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
      <text x="15" y="26" fill="#ecfdf5" font-size="11" font-family="system-ui" font-weight="bold">Android Production App</text>
      <rect x="15" y="40" width="140" height="24" rx="6" fill="#10b981"/>
      <text x="85" y="56" fill="#ffffff" font-size="10" font-family="system-ui" font-weight="bold" text-anchor="middle">Google Play Store ✓</text>
      <text x="15" y="85" fill="#94a3b8" font-size="9" font-family="system-ui">Bundle: AAB Release</text>
      <text x="15" y="102" fill="#94a3b8" font-size="9" font-family="system-ui">Signed Keystore: Active</text>
      <text x="15" y="119" fill="#34d399" font-size="9" font-family="system-ui">Crash Rate: &lt; 0.01%</text>
    </g>
  </g>

  <!-- Right Side: Invoice Generator & Bill Table -->
  <g transform="translate(215, 55)">
    <rect width="360" height="305" rx="10" fill="#022c22" stroke="#065f46" stroke-width="1.5"/>
    <text x="20" y="28" fill="#ecfdf5" font-size="12" font-family="system-ui" font-weight="bold">Live Invoicing & Ledger Breakdown</text>

    <!-- Invoice Header Box -->
    <rect x="15" y="42" width="330" height="48" rx="6" fill="#064e3b"/>
    <text x="25" y="62" fill="#ffffff" font-size="11" font-family="system-ui" font-weight="bold">INV-2026-089</text>
    <text x="25" y="78" fill="#a7f3d0" font-size="9" font-family="system-ui">Client: RealEstate Ventures Ltd</text>
    <text x="330" y="62" fill="#fde047" font-size="12" font-family="system-ui" font-weight="bold" text-anchor="end">PAID ✓</text>
    <text x="330" y="78" fill="#cbd5e1" font-size="9" font-family="system-ui" text-anchor="end">Via Razorpay / NEFT</text>

    <!-- Itemized Table -->
    <rect x="15" y="100" width="330" height="24" rx="4" fill="#0f172a"/>
    <text x="25" y="116" fill="#94a3b8" font-size="9" font-family="system-ui" font-weight="bold">DEAL DESCRIPTION</text>
    <text x="200" y="116" fill="#94a3b8" font-size="9" font-family="system-ui" font-weight="bold">RATE</text>
    <text x="270" y="116" fill="#94a3b8" font-size="9" font-family="system-ui" font-weight="bold">COMMISSION</text>

    <!-- Item 1 -->
    <line x1="15" y1="134" x2="345" y2="134" stroke="#065f46"/>
    <text x="25" y="152" fill="#f8fafc" font-size="10" font-family="system-ui">Commercial Lease Tower C</text>
    <text x="200" y="152" fill="#cbd5e1" font-size="10" font-family="system-ui">2.0%</text>
    <text x="270" y="152" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui">₹ 42,000</text>

    <!-- Item 2 -->
    <line x1="15" y1="168" x2="345" y2="168" stroke="#065f46"/>
    <text x="25" y="186" fill="#f8fafc" font-size="10" font-family="system-ui">Warehouse Facility Plot 12</text>
    <text x="200" y="186" fill="#cbd5e1" font-size="10" font-family="system-ui">1.5%</text>
    <text x="270" y="186" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui">₹ 65,000</text>

    <!-- Item 3 -->
    <line x1="15" y1="202" x2="345" y2="202" stroke="#065f46"/>
    <text x="25" y="220" fill="#f8fafc" font-size="10" font-family="system-ui">Residential Penthouse Sale</text>
    <text x="200" y="220" fill="#cbd5e1" font-size="10" font-family="system-ui">1.0%</text>
    <text x="270" y="220" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui">₹ 85,000</text>

    <!-- Bottom summary -->
    <rect x="15" y="238" width="330" height="50" rx="8" fill="url(#visAccent)"/>
    <text x="25" y="258" fill="#022c22" font-size="10" font-weight="bold" font-family="system-ui">GST Compliant & Auto Tax Deducted</text>
    <text x="25" y="274" fill="#064e3b" font-size="9" font-family="system-ui">MongoDB Aggregation Pipeline calculates split in &lt; 15ms</text>
    <text x="330" y="268" fill="#022c22" font-size="15" font-weight="extrabold" font-family="system-ui" text-anchor="end">₹ 1,92,000</text>
  </g>
</svg>
