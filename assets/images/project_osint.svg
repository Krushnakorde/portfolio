    <text x="15" y="17" fill="#cbd5e1" font-size="10" font-family="system-ui" font-weight="bold">Live OSINT Threat Intelligence Stream & Correlation</text>

    <text x="15" y="48" fill="#4ade80" font-size="9.5" font-family="monospace">[21:42:01] Target entity resolved: IP 185.220.101.42 (Anonymous Proxy/Tor)</text>
    <text x="15" y="68" fill="#f87171" font-size="9.5" font-family="monospace">[21:42:03] ALERT: Matched in known cyber fraud repository (Confidence: 0.94)</text>
    <text x="15" y="88" fill="#38bdf8" font-size="9.5" font-family="monospace">[21:42:05] Reverse Whois: 8 sibling domains registered with burner email</text>
    <text x="15" y="108" fill="#fcd34d" font-size="9.5" font-family="monospace">[21:42:07] SSL Certificate SHA-256 fingerprint verified against fraud feed</text>
    <text x="15" y="128" fill="#a78bfa" font-size="9.5" font-family="monospace">[21:42:09] Synthesizing comprehensive intelligence dossier report...</text>
    
