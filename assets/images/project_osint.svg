      <text x="12" y="55" fill="#38bdf8" font-size="28" font-weight="bold" font-family="system-ui">62</text>
      <text x="12" y="74" fill="#34d399" font-size="8.5" font-family="system-ui">Cluster Correlation ✓</text>
    </g>
