<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p3bg)" rx="12"/>

  <!-- Top bar -->
  <rect width="600" height="40" fill="#2e1065" rx="12 12 0 0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="300" y="25" fill="#f5d0fe" font-size="12" font-family="system-ui" text-anchor="middle" font-weight="bold">✨ StudySphere AI Tutor</text>

  <!-- Left Chat Panel -->
  <rect x="25" y="55" width="260" height="305" rx="8" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="40" y="85" fill="#f3e8ff" font-size="12" font-weight="bold" font-family="system-ui">AI Prompt Assistant</text>

  <!-- Chat bubble 1 (User) -->
  <rect x="60" y="105" width="210" height="45" rx="12" fill="#4338ca"/>
  <text x="75" y="125" fill="#ffffff" font-size="10" font-family="system-ui">Explain Quicksort average vs</text>
  <text x="75" y="140" fill="#ffffff" font-size="10" font-family="system-ui">worst time complexity.</text>

  <!-- Chat bubble 2 (AI response) -->
  <rect x="38" y="165" width="232" height="75" rx="12" fill="#581c87" stroke="#a855f7" stroke-width="1"/>
  <text x="50" y="185" fill="#f5d0fe" font-size="10" font-weight="bold" font-family="system-ui">AI Tutor:</text>
  <text x="50" y="202" fill="#e9d5ff" font-size="10" font-family="system-ui">Avg: O(n log n) with balanced pivots.</text>
  <text x="50" y="218" fill="#e9d5ff" font-size="10" font-family="system-ui">Worst: O(n²) if pivot is unbalanced.</text>
  <text x="50" y="233" fill="#e9d5ff" font-size="10" font-family="system-ui">Generating 5 flashcards...</text>

  <!-- Right Flashcard preview -->
  <g transform="translate(305, 55)">
    <rect width="270" height="170" rx="12" fill="url(#aiGrad)"/>
    <text x="25" y="40" fill="#ffffff" font-size="12" font-family="system-ui" font-weight="bold">FLASHCARD #04</text>
    <text x="25" y="75" fill="#ffffff" font-size="16" font-family="system-ui" font-weight="bold">Master Theorem</text>
    <text x="25" y="105" fill="#fdf4ff" font-size="11" font-family="monospace">T(n) = aT(n/b) + f(n)</text>
    <rect x="25" y="125" width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.25"/>
    <text x="80" y="142" fill="#ffffff" font-size="10" font-weight="bold" font-family="system-ui" text-anchor="middle">Tap to flip ↻</text>
  </g>

  <!-- Progress bar card -->
  <g transform="translate(305, 240)">
    <rect width="270" height="120" rx="10" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f3e8ff" font-size="12" font-weight="bold" font-family="system-ui">Spaced Repetition Mastery</text>
    <rect x="20" y="55" width="230" height="12" rx="6" fill="#312e81"/>
    <rect x="20" y="55" width="190" height="12" rx="6" fill="#c084fc"/>
    <text x="20" y="90" fill="#a855f7" font-size="11" font-family="system-ui">86% Retention Rate</text>
    <text x="205" y="90" fill="#34d399" font-size="11" font-family="system-ui" font-weight="bold">Active</text>
  </g>
</svg>
